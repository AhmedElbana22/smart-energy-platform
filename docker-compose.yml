name: smart-energy-platform

services:
  # Default service: starting the project without a profile starts Kafka only.
  kafka:
    image: confluentinc/cp-kafka:7.7.12
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 1500m
    cpus: 1.5
    restart: unless-stopped

  # Kafka Connect worker is included, but the HDFS sink plugin is intentionally
  # not bundled until the team confirms the connector version/license and Hadoop compatibility.
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.7.12
    profiles: ["connect"]
    hostname: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:29092"
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_GROUP_ID: "smart-energy-connect"
      CONNECT_CONFIG_STORAGE_TOPIC: "_smart_energy_connect_configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "_smart_energy_connect_offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "_smart_energy_connect_status"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_LOG4J_ROOT_LOGLEVEL: "INFO"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    mem_limit: 1500m
    cpus: 1.0
    restart: unless-stopped

  # Branch A: Flink runs continuously; a Kafka consumer job must be submitted separately.
  flink-jobmanager:
    image: smart-energy-flink:1.20.2
    build:
      context: ./flink
      dockerfile: Dockerfile
    profiles: ["streaming"]
    command: jobmanager
    hostname: flink-jobmanager
    ports:
      - "8085:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        parallelism.default: 1
    mem_limit: 1400m
    volumes:
      - ./flink/sql:/opt/flink/sql:ro
    cpus: 1.0
    restart: unless-stopped

  flink-taskmanager:
    image: smart-energy-flink:1.20.2
    build:
      context: ./flink
      dockerfile: Dockerfile
    profiles: ["streaming"]
    command: taskmanager
    hostname: flink-taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1280m
        taskmanager.numberOfTaskSlots: 2
    mem_limit: 1600m
    cpus: 1.0
    restart: unless-stopped

  # Branch B: HDFS is enabled by either the batch or connect profile.
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    profiles: ["batch", "connect"]
    hostname: namenode
    env_file:
      - ./config/hadoop.env
    environment:
      CLUSTER_NAME: smart-energy
      CORE_CONF_fs_defaultFS: "hdfs://namenode:8020"
      HDFS_CONF_dfs_replication: 1
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
    mem_limit: 1100m
    cpus: 0.75
    restart: unless-stopped

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    profiles: ["batch", "connect"]
    hostname: datanode
    env_file:
      - ./config/hadoop.env
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: "hdfs://namenode:8020"
      HDFS_CONF_dfs_replication: 1
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    ports:
      - "9864:9864"
    volumes:
      - hdfs_datanode:/hadoop/dfs/data
    mem_limit: 1200m
    cpus: 0.75
    restart: unless-stopped

  # Spark includes an Iceberg runtime jar and a HadoopCatalog configured on HDFS.
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: smart-energy-spark-iceberg:3.5.9-1.9.2
    profiles: ["batch"]
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    depends_on:
      - namenode
      - datanode
    ports:
      - "8082:8080"
      - "7077:7077"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
    environment:
      HADOOP_CONF_DIR: /opt/spark/conf
      SPARK_NO_DAEMONIZE: "true"
    mem_limit: 1100m
    cpus: 0.75
    restart: unless-stopped

  spark-worker:
    image: smart-energy-spark-iceberg:3.5.9-1.9.2
    profiles: ["batch"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "2", "--memory", "1536m", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    volumes:
      - ./spark/jobs:/opt/spark/jobs
    environment:
      HADOOP_CONF_DIR: /opt/spark/conf
      SPARK_NO_DAEMONIZE: "true"
    mem_limit: 1900m
    cpus: 1.5
    restart: unless-stopped

  # Airflow uses LocalExecutor for a lighter local development setup.
  # This is a development configuration, not a production deployment.
  airflow-db:
    image: postgres:16-alpine
    profiles: ["orchestration"]
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-change_me_local_only}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 500m
    cpus: 0.5
    restart: unless-stopped

  airflow-init:
    image: apache/airflow:2.10.5-python3.11
    profiles: ["orchestration"]
    depends_on:
      airflow-db:
        condition: service_healthy
    entrypoint: /bin/bash
    command: ["/opt/airflow/init-airflow.sh"]
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-change_me_local_only}@airflow-db:5432/${AIRFLOW_DB_NAME:-airflow}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-dev-secret-change-me}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-change_me_local_only}
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/init-airflow.sh:/opt/airflow/init-airflow.sh:ro
      - airflow_logs:/opt/airflow/logs
    # Init runs as root only to set the named log-volume ownership before Airflow starts.
    mem_limit: 900m
    cpus: 0.75

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.11
    profiles: ["orchestration"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "8080:8080"
    environment: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    user: "${AIRFLOW_UID:-50000}:0"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 900m
    cpus: 0.75
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.11
    profiles: ["orchestration"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    environment: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    user: "${AIRFLOW_UID:-50000}:0"
    mem_limit: 1000m
    cpus: 1.0
    restart: unless-stopped

  # One-off dbt container. Snowflake itself is a cloud service, not a local container.
  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    image: smart-energy-dbt:1.9.2
    profiles: ["analytics"]
    working_dir: /workspace
    entrypoint: ["dbt"]
    command: ["--help"]
    environment:
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-}
      SNOWFLAKE_RAW_SCHEMA: ${SNOWFLAKE_RAW_SCHEMA:-RAW}
    volumes:
      - ./dbt:/workspace
      - ./dbt/profiles.yml:/root/.dbt/profiles.yml:ro
    mem_limit: 900m
    cpus: 1.0

  # Optional CPU baseline model runner. Training/scoring code and any extra model dependencies are added later.
  ml-runner:
    build:
      context: ./ml
      dockerfile: Dockerfile
    image: smart-energy-ml:dev
    profiles: ["ml"]
    working_dir: /app
    volumes:
      - ./ml/src:/app/src
      - ./data/processed:/data/processed
    mem_limit: 1500m
    cpus: 1.5

  # Monitoring stack; service-specific exporters will be added when their metrics are configured.
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    mem_limit: 500m
    cpus: 0.5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_local_only}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    mem_limit: 500m
    cpus: 0.5
    restart: unless-stopped

  # Optional one-off producer container. It sends the real CSV fields as available;
  # do not infer meter_id from id until the source schema is confirmed.
  generator:
    build:
      context: ./generator
      dockerfile: Dockerfile
    image: smart-energy-generator:dev
    profiles: ["producer"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: meter-readings
      INPUT_CSV: /data/raw/real_readings.csv
      PUBLISH_INTERVAL_SECONDS: ${PUBLISH_INTERVAL_SECONDS:-2}
    volumes:
      - ./data/raw:/data/raw:ro
    mem_limit: 500m
    cpus: 0.5

volumes:
  kafka_data:
  hdfs_namenode:
  hdfs_datanode:
  airflow_db_data:
  airflow_logs:
  prometheus_data:
  grafana_data:
